# Šablona – nginx.conf z ní vyrábí tools/export_web.py (odpověď z data/web.json). Používá se jen při nasazení v kontejneru (Podman/CapRover); je to celý nginx.conf pro běh bez root.
# Lehké přihlášení: přihlašovací stránka uloží do cookie "rodokmen" otisk (SHA-256) odpovědi na rodinnou otázku
# a nginx ho tady porovná. Samotná odpověď není ani tady, ani v prohlížeči.
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;

  # nginx běží pod nepřivilegovaným uživatelem, dočasné soubory patří do /tmp
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  map $cookie_rodokmen $rodokmen_ok {
    default 0;
  {{ODPOVED}}
  }

  server {
    listen 8080;
    root /opt/app-root/www;
    index index.html;
    charset utf-8;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # přihlašovací stránka je dostupná vždy
    location = /prihlaseni.html {
      add_header Cache-Control "no-store" always;
      add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location / {
      if ($rodokmen_ok = 0) {
        return 401;
      }
      try_files $uri $uri/ =404;
    }

    location ~* \.(jpg|png|svg|css|js|woff2|json|pf_[a-z]+)$ {
      if ($rodokmen_ok = 0) {
        return 401;
      }
      expires 30d;
      add_header Cache-Control "private";
    }

    error_page 401 /prihlaseni.html;
    error_page 404 /404.html;
  }
}
